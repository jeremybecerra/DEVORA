<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#840303" />
    <meta name="description" content="DEVORA: organiza tu pedido individual en una mesa compartida." />
    <title>DEVORA · Tu mesa, tu pedido</title>
    <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
    <link rel="stylesheet" href="/css/styles.css" />
    <script type="module" src="/js/app.js"></script>
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <div class="header-inner">
          <div class="brand" aria-label="DEVORA">
            <img src="/assets/logo.svg" alt="" width="49" height="49" />
            <span class="brand-copy"><strong>DEVORA</strong><small>Pedidos y pagos individuales</small></span>
          </div>
          <div class="header-actions">
            <span id="header-table" class="table-tag" hidden></span>
            <button id="call-waiter" class="waiter-button" type="button" data-action="call-waiter" hidden>Llamar al mesero</button>
          </div>
        </div>
      </header>

      <main id="app" class="main-content" tabindex="-1" aria-live="polite"></main>
      <div id="global-status" class="global-status" role="status" aria-live="polite" hidden></div>

      <footer class="site-footer">
        <span>DEVORA</span><span>Comparte la mesa, no la confusión.</span>
      </footer>
    </div>
  </body>
</html>
